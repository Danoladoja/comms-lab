      operationId: uploadProgramThumbnail
      tags: [programs]
      summary: Upload or replace the programme's thumbnail
      description: >-
        Admin only. The image arrives as raw bytes rather than a multipart form,
        matching how slide decks are uploaded. A second upload replaces the
        first. On success the programme's thumbnailUrl is set to this endpoint.
