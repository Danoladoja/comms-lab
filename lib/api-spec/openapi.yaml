openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user
  - name: programs
    description: Programs and sessions
  - name: enrollments
    description: Enrollment operations
  - name: admin
    description: Admin operations
  - name: partnerships
    description: Public partnership enquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get (and JIT-provision) the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List programs (published only for non-admins)
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [admin]
      summary: Create a program (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a program
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateProgram
      tags: [admin]
      summary: Update a program (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}/sessions:
    get:
      operationId: listProgramSessions
      tags: [programs]
      summary: List sessions of a program (join/recording links only when authorized)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: createSession
      tags: [admin]
      summary: Add a session to a program (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}:
    patch:
      operationId: updateSession
      tags: [admin]
      summary: Update a session (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSession
      tags: [admin]
      summary: Delete a session (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/join:
    post:
      operationId: joinSession
      tags: [enrollments]
      summary: Record attendance for a live session and return the join link (learners must have unlocked the module)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attendance recorded (or already recorded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/quiz:
    get:
      operationId: getSessionQuiz
      tags: [enrollments]
      summary: Get the quiz for a module (answers hidden for learners; module must be unlocked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quiz questions and the learner's best result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No quiz for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: upsertSessionQuiz
      tags: [admin]
      summary: Replace the quiz for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/quiz/attempts:
    post:
      operationId: submitQuizAttempt
      tags: [enrollments]
      summary: Submit quiz answers; graded on the server, 70% passes, unlimited retakes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No quiz for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/assignment:
    get:
      operationId: getSessionAssignment
      tags: [enrollments]
      summary: Get the assignment for a module with the learner's submission if any
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No assignment for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: upsertSessionAssignment
      tags: [admin]
      summary: Create or replace the assignment for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/assignment/submission:
    post:
      operationId: submitAssignment
      tags: [enrollments]
      summary: Submit (or update) the written assignment for a module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionInput"
      responses:
        "200":
          description: Submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmission"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No assignment for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/readings:
    get:
      operationId: getSessionReadings
      tags: [enrollments]
      summary: Further reading for a module (ungraded)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The reading list, possibly empty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingItem"
        "403":
          description: Not enrolled or module locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: setSessionReadings
      tags: [admin]
      summary: Replace the reading list for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingListInput"
      responses:
        "200":
          description: Saved, with anything that was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/slides:
    get:
      operationId: getSessionSlides
      tags: [enrollments]
      summary: The slide deck for a module, if one has been uploaded
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deck details (the file itself is downloaded separately)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlideDeck"
        "404":
          description: No deck for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSessionSlides
      tags: [admin]
      summary: Remove the slide deck for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/slides/visibility:
    patch:
      operationId: setSlidesVisibility
      tags: [admin]
      summary: Show or hide the deck from learners
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlidesVisibilityInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlideDeck"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No deck for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/coursework/draft:
    post:
      operationId: draftCourseworkFromSlides
      tags: [admin]
      summary: Draft a quiz and a written task from the module's material
      description: >
        Reads the slide deck, the pasted material (usually a transcript), or
        both. Returns a draft for a human to edit and approve. Nothing is saved
        by this call — the facilitator reviews it and saves through the normal
        quiz and assignment endpoints.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: A draft, possibly with problems noted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseworkDraftResult"
        "400":
          description: There is too little class material to draft from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: No AI key configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/notes:
    get:
      operationId: getSessionNotes
      tags: [admin]
      summary: The material a facilitator pasted in for this module
      description: >
        Usually a transcript of the class, copied out of the recording. Read by
        the coursework drafter alongside the slides, and never shown to learners.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The pasted material, empty if none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: setSessionNotes
      tags: [admin]
      summary: Replace the pasted material for a module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNotesInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/coursework/questions/replace:
    post:
      operationId: replaceDraftQuestion
      tags: [admin]
      summary: Redo one quiz question
      description: >
        Returns a single replacement for the question at replaceIndex, written
        from the same class material and checked not to repeat anything already
        on the quiz. Saves nothing. The existing questions are sent from the
        editor rather than read from the database, so unsaved edits count.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceQuestionInput"
      responses:
        "200":
          description: A replacement question, or an explanation of why there is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionsDraftResult"
        "400":
          description: Not enough class material to draft from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: No AI key configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/coursework/questions/more:
    post:
      operationId: draftMoreQuestions
      tags: [admin]
      summary: Ask for more quiz questions
      description: >
        Returns further questions covering ground the existing ones do not.
        Anything that restates a question already on the quiz is dropped before
        it is returned. Saves nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoreQuestionsInput"
      responses:
        "200":
          description: Further questions, or an explanation of why there are none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionsDraftResult"
        "400":
          description: Not enough class material, or the quiz is already full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: No AI key configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/coursework/history:
    get:
      operationId: getCourseworkDraftHistory
      tags: [admin]
      summary: What this module's coursework was drafted from, and when
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Drafting runs, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseworkDraftRun"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/presence/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [enrollments]
      summary: Report that the learner still has the classroom open during a live class
      description: >
        Credits the gap since the previous beat, clamped to the scheduled window
        and capped per beat. Rejected outside the live window.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled, module locked, or the class is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/replay/progress:
    post:
      operationId: recordReplayProgress
      tags: [enrollments]
      summary: Report which slices of the recording the learner has watched
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayProgressInput"
      responses:
        "200":
          description: Progress recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayProgressResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled or module locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/reviews/queue:
    get:
      operationId: getReviewQueue
      tags: [enrollments]
      summary: The peer submissions this learner should critique next for a module
      description: >
        Least-reviewed work first so nobody's submission goes unseen. The queue
        is empty until the learner has submitted their own make — otherwise it
        would be a way to read everyone else's answer first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No assignment for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /submissions/{submissionId}/reviews:
    post:
      operationId: submitReview
      tags: [enrollments]
      summary: Write a peer critique of another learner's submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Critique recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedReview"
        "400":
          description: Incomplete critique
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not allowed to review this submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Already reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/feedback:
    get:
      operationId: getMyFeedback
      tags: [enrollments]
      summary: The critiques this learner's own submission has received
