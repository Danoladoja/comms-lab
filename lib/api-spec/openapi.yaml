        "503":
          description: Email is not configured or the provider refused the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    BulkInviteEntry:
      type: object
      required: [email]
      properties:
        row:
          type: integer
          description: The line of the admin's own sheet, so a result can be pointed back at it.
        name:
          type: string
        email:
          type: string
    BulkInviteBody:
      type: object
      required: [programId, entries]
      properties:
        programId:
          type: integer
          description: The cohort each invited learner is enrolled onto when they accept.
        entries:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/BulkInviteEntry"
    BulkInviteOutcome:
      type: object
      required: [email, status, detail]
      properties:
        row:
          type: integer
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [invited, enrolled, already-enrolled, reinvited, failed]
          description: >-
            invited — a new person, invitation sent. enrolled — they already had
            an account and were put straight onto the programme. already-enrolled
            — nothing to do. reinvited — a previous unaccepted invitation was
            withdrawn and replaced. failed — see detail.
        detail:
          type: string
    BulkInviteResult:
      type: object
      required: [outcomes, invited, enrolled, alreadyEnrolled, failed]
      properties:
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BulkInviteOutcome"
        invited:
          type: integer
        enrolled:
          type: integer
        alreadyEnrolled:
          type: integer
        failed:
          type: integer
    PartnershipEnquiryInput:
      type: object
      required: [name, organisation, email, interest, message]
      properties:
        name:
          type: string
          maxLength: 120
        organisation:
          type: string
          maxLength: 160
        email:
          type: string
          maxLength: 320
        interest:
          type: string
          enum: [teach, host, fund, media, other]
        message:
          type: string
          minLength: 20
          maxLength: 4000
        honeypot:
          type: string
          description: >-
            A field the form hides from view. A person leaves it empty; the
            crude scrapers that find this page fill everything. Anything here
            means the submission is dropped, and 202 is returned regardless so
            the sender learns nothing about why.
    PartnershipEnquiryProblems:
      type: object
      description: One sentence per field that needs fixing. Absent keys are fine.
      properties:
        name:
          type: string
        organisation:
          type: string
        email:
          type: string
        interest:
          type: string
        message:
          type: string
    ForumThread:
      type: object
      required: [id, programId, title, body, pinned, authorName, authorRole, replyCount, lastActivityAt, createdAt, mine]
      properties:
        id: { type: integer }
        programId: { type: integer }
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        authorName: { type: string }
        authorRole: { type: string }
        replyCount: { type: integer }
        lastActivityAt: { type: string }
        createdAt: { type: string }
        mine: { type: boolean }
    ThreadList:
      type: object
      required: [canModerate, threads]
      properties:
        canModerate: { type: boolean }
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ForumThread"
    ForumPost:
      type: object
      required: [id, threadId, body, authorName, authorRole, createdAt, mine]
      properties:
        id: { type: integer }
        threadId: { type: integer }
        body: { type: string }
        authorName: { type: string }
        authorRole: { type: string }
        createdAt: { type: string }
        mine: { type: boolean }
    ThreadDetail:
      type: object
      required: [thread, posts, canModerate]
      properties:
        thread:
          $ref: "#/components/schemas/ForumThread"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/ForumPost"
        canModerate: { type: boolean }
    ThreadInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 5000 }
    PostInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    PinInput:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Invitation:
      type: object
      required: [id, email, role, sessionIds, createdAt, summary]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string }
        sessionIds:
          type: array
          items: { type: integer }
        createdAt: { type: string }
        # Set once the person has arrived and their classes have been handed over.
        acceptedAt:
          oneOf:
            - type: string
            - type: "null"
        summary: { type: string }
    InvitationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }
        # Admin is accepted only from a super admin; the server decides, and a
        # super admin is never invitable by anyone. See the server.
        role:
          type: string
          enum: [admin, instructor, learner]
        sessionIds:
          type: array
          maxItems: 20
          items: { type: integer }
    ApiMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    User:
      type: object
      required: [id, clerkUserId, email, name, role]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [learner, instructor, admin, superadmin] }
    JoinResult:
      type: object
      required: [sessionId, joinedAt, countedAsOnTime]
      properties:
        sessionId: { type: integer }
        joinedAt: { type: string }
        joinUrl: { type: ["string", "null"] }
        # False when the learner joined after the on-time grace window. The UI
        # says so out loud instead of failing silently.
        countedAsOnTime: { type: boolean }
    Certificate:
      type: object
      required: [programId, programTitle, learnerName, completedAt, certificateId, portfolioPublic, modulesCompleted, reviewsWritten]
      properties:
        programId: { type: integer }
        programTitle: { type: string }
        learnerName: { type: string }
        completedAt: { type: ["string", "null"], format: date-time }
        # Opaque random code (AECL-XXXX-XXXX-XXXX), not derived from any id.
        certificateId: { type: string }
        portfolioPublic: { type: boolean }
        modulesCompleted: { type: integer }
        reviewsWritten: { type: integer }
    PublicCertificate:
      type: object
      required: [programTitle, learnerName, completedAt, certificateId, portfolioPublic, modulesCompleted, reviewsWritten, works]
      properties:
        programTitle: { type: string }
        learnerName: { type: string }
        completedAt: { type: ["string", "null"], format: date-time }
        certificateId: { type: string }
        portfolioPublic: { type: boolean }
        modulesCompleted: { type: integer }
        reviewsWritten: { type: integer }
        # Only populated when the learner has opted their portfolio public.
        works:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWork"
    PortfolioWork:
      type: object
      required: [title, body, submittedAt]
      properties:
        title: { type: string }
        body: { type: string }
        submittedAt: { type: string }
    PortfolioVisibilityInput:
      type: object
      required: [portfolioPublic]
      properties:
        portfolioPublic: { type: boolean }
    SessionProgress:
      type: object
      required: [sessionId, programId, progressPct, attendedLive, attended, presence, completed, locked, hasQuiz, quizPassed, quizBestScore, hasAssignment, assignmentSubmitted, reviewsRequired, reviewsGiven, reviewsReceived, feedbackUnlocked]
      properties:
        sessionId: { type: integer }
        programId: { type: integer }
        progressPct: { type: integer }
        attendedLive: { type: boolean }
        attended: { type: boolean }
        presence:
          $ref: "#/components/schemas/Presence"
        completed: { type: boolean }
        locked: { type: boolean }
        hasQuiz: { type: boolean }
        quizPassed: { type: boolean }
        quizBestScore: { type: ["integer", "null"] }
        hasAssignment: { type: boolean }
        assignmentSubmitted: { type: boolean }
        reviewsRequired: { type: integer }
        reviewsGiven: { type: integer }
        reviewsReceived: { type: integer }
        feedbackUnlocked: { type: boolean }
    QuizQuestionPublic:
      type: object
      required: [id, prompt, options, sortOrder]
      properties:
        id: { type: integer }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        correctIndex: { type: ["integer", "null"] }
        # Sent only to staff, alongside correctIndex. How the question came to
        # exist: manual, drafted, or edited.
        origin: { type: ["string", "null"] }
    Quiz:
      type: object
      required: [sessionId, passMark, questions, bestScore, passed]
      properties:
        sessionId: { type: integer }
        passMark: { type: integer }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestionPublic"
        bestScore: { type: ["integer", "null"] }
        passed: { type: boolean }
    QuizInput:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [prompt, options, correctIndex]
            properties:
              prompt: { type: string, minLength: 1 }
              options:
                type: array
                minItems: 2
                items: { type: string, minLength: 1 }
              correctIndex: { type: integer, minimum: 0 }
              # How the question came to exist: manual, drafted, or edited.
              # Never shown to learners; never affects marking.
              origin:
                type: string
                enum: [manual, drafted, edited]
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, answerIndex]
            properties:
              questionId: { type: integer }
              answerIndex: { type: integer }
    QuizResult:
      type: object
      required: [sessionId, scorePct, passed, correctCount, totalQuestions, bestScore]
      properties:
        sessionId: { type: integer }
        scorePct: { type: integer }
        passed: { type: boolean }
        correctCount: { type: integer }
        totalQuestions: { type: integer }
        bestScore: { type: integer }
    ReadingItem:
      type: object
      required: [title, url, note]
      properties:
        title: { type: string }
        url: { type: string }
        note: { type: string }
    ReadingListInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string, maxLength: 200 }
              url: { type: string }
              note: { type: string, maxLength: 400 }
    ReadingListProblem:
      type: object
      required: [index, message]
      properties:
        # Which row was rejected, so the facilitator can find it.
        index: { type: integer }
        message: { type: string }
    ReadingListResult:
      type: object
      required: [items, problems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingItem"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ReadingListProblem"
    SlideDeck:
      type: object
      required: [sessionId, filename, mimeType, sizeBytes, visibleToLearners, hasReadableText, textChars, canDraft, uploadedAt, downloadPath]
      properties:
        sessionId: { type: integer }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        visibleToLearners: { type: boolean }
        # False for a PDF or an image-only deck: readable enough for a learner,
        # but nothing for the drafter to work from.
        hasReadableText: { type: boolean }
        textChars: { type: integer }
        canDraft: { type: boolean }
        uploadedAt: { type: string, format: date-time }
        downloadPath: { type: string }
    SlidesVisibilityInput:
      type: object
      required: [visibleToLearners]
      properties:
        visibleToLearners: { type: boolean }
    DraftQuestion:
      type: object
      required: [prompt, options, correctIndex, rationale]
      properties:
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        correctIndex: { type: integer }
        # Why that answer is right. Shown to the facilitator, never to learners.
        rationale: { type: string }
    DraftAssignment:
      type: object
      required: [title, instructions, reviewsRequired]
      properties:
        title: { type: string }
        instructions: { type: string }
        reviewsRequired: { type: integer }
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
    CourseworkDraftResult:
      type: object
      required: [problems, notes]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DraftQuestion"
        assignment:
          oneOf:
            - $ref: "#/components/schemas/DraftAssignment"
            - type: "null"
        # What had to be dropped or corrected before showing this.
        problems:
          type: array
          items: { type: string }
        # What the drafter wants a second pair of eyes on.
        notes:
          type: array
          items: { type: string }
        source:
          oneOf:
            - $ref: "#/components/schemas/DraftSource"
            - type: "null"
    SessionNotes:
      type: object
      required: [sessionId, label, body, chars, updatedAt]
      properties:
        sessionId: { type: integer }
        # "Transcript", "Speaker notes", and so on.
        label: { type: string }
        body: { type: string }
        chars: { type: integer }
        updatedAt:
          oneOf:
            - type: string
            - type: "null"
    SessionNotesInput:
      type: object
      required: [body]
      properties:
        label: { type: string, maxLength: 60 }
        body: { type: string }
    DraftSource:
      type: object
      required: [kinds, chars, truncated, description]
      properties:
        # Which material was read: some of "slides", "notes".
        kinds:
          type: array
          items: { type: string }
        chars: { type: integer }
        # True when material had to be cut to fit the drafter's budget.
        truncated: { type: boolean }
        # One phrase for the facilitator: "the slides and the transcript".
        description: { type: string }
    ExistingQuestionInput:
      type: object
      required: [prompt, options]
      properties:
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
    ReplaceQuestionInput:
      type: object
      required: [existing, replaceIndex]
      properties:
        # The quiz as it stands in the editor, including unsaved edits.
        existing:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExistingQuestionInput"
        replaceIndex: { type: integer, minimum: 0 }
        # What the facilitator wants different about it, in their own words.
        guidance: { type: string, maxLength: 500 }
    MoreQuestionsInput:
      type: object
      required: [existing]
      properties:
        existing:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExistingQuestionInput"
        wanted: { type: integer, minimum: 1, maximum: 4 }
        guidance: { type: string, maxLength: 500 }
    QuestionsDraftResult:
      type: object
      required: [questions, problems, notes]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DraftQuestion"
        problems:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
        source:
          oneOf:
            - $ref: "#/components/schemas/DraftSource"
            - type: "null"
    CourseworkDraftRun:
      type: object
      required: [id, kind, model, questionCount, createdAt, summary]
      properties:
        id: { type: integer }
        # "draft", "replace" or "expand".
        kind: { type: string }
        model: { type: string }
        questionCount: { type: integer }
        createdAt: { type: string }
        by:
          oneOf:
            - type: string
            - type: "null"
        # A ready-made sentence: "5 questions drafted from the slides and the
        # transcript on 12 August 2026 by Amina."
        summary: { type: string }
    Presence:
      type: object
      required: [livePct, replayPct, bestPct, met, via, thresholdPct]
      properties:
        livePct: { type: integer }
        replayPct: { type: integer }
        # The better of the two routes — never their sum, since both timelines
        # cover the same material.
        bestPct: { type: integer }
        met: { type: boolean }
        via: { type: string, enum: [live, replay, none] }
        thresholdPct: { type: integer }
    HeartbeatResult:
      type: object
      required: [sessionId, liveSeconds, presence]
      properties:
        sessionId: { type: integer }
        liveSeconds: { type: integer }
        presence:
          $ref: "#/components/schemas/Presence"
    ReplayProgressInput:
      type: object
      required: [buckets]
      properties:
        # Fifteen-second slices of the recording actually played. Sending a
        # bucket beyond the recording's length is discarded server-side.
        buckets:
          type: array
          maxItems: 5000
          items: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 1 }
    ReplayProgressResult:
      type: object
      required: [sessionId, watchedSeconds, durationSeconds, presence]
      properties:
        sessionId: { type: integer }
        watchedSeconds: { type: integer }
        durationSeconds: { type: ["integer", "null"] }
        presence:
          $ref: "#/components/schemas/Presence"
    RubricCriterion:
      type: object
      required: [id, label, description, maxScore]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        description: { type: string }
        maxScore: { type: integer, minimum: 2, maximum: 10 }
    AssignmentDetail:
      type: object
      required: [sessionId, title, instructions, rubric, reviewsRequired]
      properties:
        sessionId: { type: integer }
        title: { type: string }
        instructions: { type: string }
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        reviewsRequired: { type: integer }
        # Sent to staff only. How the task came to exist: manual, drafted, edited.
        origin: { type: ["string", "null"] }
        mySubmission:
          oneOf:
            - $ref: "#/components/schemas/AssignmentSubmission"
            - type: "null"
    AssignmentInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        instructions: { type: string }
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        reviewsRequired: { type: integer, minimum: 0, maximum: 5 }
        origin:
          type: string
          enum: [manual, drafted, edited]
    AssignmentSubmissionInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    AssignmentSubmission:
      type: object
      required: [sessionId, body, submittedAt]
      properties:
        sessionId: { type: integer }
        body: { type: string }
        submittedAt: { type: string }
    ReviewTarget:
      type: object
      required: [submissionId, body, submittedAt]
      properties:
        submissionId: { type: integer }
        # The author is deliberately absent: critique is blind in both
        # directions so the work is judged, not the person.
        body: { type: string }
        submittedAt: { type: string }
    ReviewQueue:
      type: object
      required: [sessionId, rubric, reviewsRequired, reviewsGiven, canReview, reason, targets]
      properties:
        sessionId: { type: integer }
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        reviewsRequired: { type: integer }
        reviewsGiven: { type: integer }
        canReview: { type: boolean }
        # Why the queue is closed, when it is: "not-submitted", "none-available",
        # "done", or "" when the learner can review right now.
        reason: { type: string }
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ReviewTarget"
    ReviewInput:
      type: object
      required: [scores, comment]
      properties:
        scores:
          type: object
          additionalProperties: { type: integer }
        comment: { type: string, minLength: 1, maxLength: 5000 }
    ReceivedReview:
      type: object
      required: [id, scores, comment, createdAt, scorePct]
      properties:
        id: { type: integer }
        scores:
          type: object
          additionalProperties: { type: integer }
        comment: { type: string }
        createdAt: { type: string }
        scorePct: { type: integer }
    MyFeedback:
      type: object
      required: [sessionId, unlocked, reviewsRequired, reviewsGiven, rubric, reviews]
      properties:
        sessionId: { type: integer }
        # Feedback unlocks once the learner has written the critiques they owe.
        unlocked: { type: boolean }
        reviewsRequired: { type: integer }
        reviewsGiven: { type: integer }
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedReview"
    GoogleConnectionStatus:
      type: object
      required: [connected, configured, secretConfigured]
      properties:
        # A Google account is linked and usable.
        connected: { type: boolean }
        # The server has the client id/secret it needs to offer the connect flow.
        configured: { type: boolean }
        # GOOGLE_TOKEN_SECRET is set, without which a token cannot be stored.
        secretConfigured: { type: boolean }
        googleEmail: { type: ["string", "null"] }
        connectedAt: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
        # Where to send the admin to grant access. Null when not configured.
        authorizeUrl: { type: ["string", "null"] }
    RecordingStatusRow:
      type: object
      required: [sessionId, sessionTitle, programTitle, status, attempts, hasMeetUrl]
      properties:
        sessionId: { type: integer }
        sessionTitle: { type: string }
        programTitle: { type: string }
        startsAt: { type: ["string", "null"], format: date-time }
        # pending | searching | uploading | ready | failed | manual
        status: { type: string }
        attempts: { type: integer }
        hasMeetUrl: { type: boolean }
        recordingUrl: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        checkedAt: { type: ["string", "null"], format: date-time }
    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [learner, instructor, admin, superadmin] }
    Program:
      type: object
      required: [id, tag, title, description, startDate, format, duration, capacity, status, enrolledCount]
      properties:
        id: { type: integer }
        tag: { type: string }
        title: { type: string }
        description: { type: string }
        startDate: { type: string }
        format: { type: string }
        duration: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        capacity: { type: integer }
        status: { type: string, enum: [draft, published, closed, archived] }
        enrolledCount: { type: integer }
    ProgramInput:
      type: object
      required: [tag, title, description, startDate, format, duration]
      properties:
        tag: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        startDate: { type: string, minLength: 1 }
        format: { type: string, minLength: 1 }
        duration: { type: string, minLength: 1 }
        thumbnailUrl: { type: string }
        capacity: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, closed, archived] }
    ProgramUpdate:
      type: object
      properties:
        tag: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        startDate: { type: string, minLength: 1 }
        format: { type: string, minLength: 1 }
        duration: { type: string, minLength: 1 }
        thumbnailUrl: { type: string }
        capacity: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, closed, archived] }
    Session:
      type: object
      required: [id, programId, title, description, sortOrder, durationMins]
      properties:
        id: { type: integer }
        programId: { type: integer }
        title: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        startsAt: { type: ["string", "null"], format: date-time }
        durationMins: { type: integer }
        meetUrl: { type: ["string", "null"] }
        recordingUrl: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        instructorName: { type: ["string", "null"] }
        # A facilitator with no account. instructorName carries whichever of the
        # two is set, so a page that only wants a name reads one field.
        guestFacilitator: { type: ["string", "null"] }
    SessionDetail:
      type: object
      required: [id, programId, programTitle, title, description, sortOrder, durationMins, hasMeetUrl]
      properties:
        id: { type: integer }
        programId: { type: integer }
        programTitle: { type: string }
        title: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        startsAt: { type: ["string", "null"], format: date-time }
        durationMins: { type: integer }
        # Creating the meeting room is the admin's job. Only admins ever receive
        # the raw link; everyone else — learners and facilitators alike — gets it
        # by pressing Join, which is also what records their time in class.
        meetUrl: { type: ["string", "null"] }
        # Whether a room has been set up at all, so the UI can say "not ready yet".
        hasMeetUrl: { type: boolean }
        recordingUrl: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        instructorName: { type: ["string", "null"] }
        # A facilitator with no account. instructorName carries whichever of the
        # two is set, so a page that only wants a name reads one field.
        guestFacilitator: { type: ["string", "null"] }
    SessionInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        sortOrder: { type: integer }
        startsAt: { type: ["string", "null"], format: date-time }
        durationMins: { type: integer, minimum: 5 }
        meetUrl: { type: string }
        recordingUrl: { type: string }
        instructorId: { type: ["integer", "null"] }
        guestFacilitator: { type: ["string", "null"] }
    PlainMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    WaitlistSignupBody:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 320 }
        # The programme id as text, or "any" for whatever runs next.
        programme: { type: string }
        note: { type: string, maxLength: 1000 }
        # Hidden field. A person leaves it empty; a crude script fills it.
        trap: { type: string }
    WaitlistEntry:
      type: object
      required: [id, name, email, status]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        programId: { type: ["integer", "null"] }
        programTitle: { type: ["string", "null"] }
        note: { type: string }
        status: { type: string, enum: [waiting, invited, declined] }
        createdAt: { type: string, format: date-time }
    WaitlistEntryUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, invited, declined] }
    WaitlistEntryState:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, enum: [waiting, invited, declined] }
    UnattachedUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
    StaffMember:
      type: object
      required: [id, name, email, role, programmes]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [learner, instructor, admin, superadmin] }
        programmes:
          type: array
          items:
            type: object
            required: [programId, programTitle, sessions]
            properties:
              programId: { type: integer }
              programTitle: { type: string }
              sessions: { type: integer }
    StaffList:
      type: object
      required: [you, staff]
      properties:
        # The first staff account. Its role is fixed, so the Lab cannot end up
        # with its owner locked out.
        founderId: { type: ["integer", "null"] }
        you:
          type: object
          required: [role]
          properties:
            id: { type: ["integer", "null"] }
            role: { type: string }
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
    SessionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        sortOrder: { type: integer }
        startsAt: { type: ["string", "null"], format: date-time }
        durationMins: { type: integer, minimum: 5 }
        meetUrl: { type: ["string", "null"] }
        recordingUrl: { type: ["string", "null"] }
        instructorId: { type: ["integer", "null"] }
        guestFacilitator: { type: ["string", "null"] }
    Enrollment:
      type: object
      required: [id, userId, programId, status]
      properties:
        id: { type: integer }
        userId: { type: integer }
        programId: { type: integer }
        status: { type: string, enum: [enrolled, waitlisted, cancelled, completed] }
    EnrollmentDetail:
      type: object
      required: [id, userId, programId, status, programTitle, userName, userEmail]
      properties:
        id: { type: integer }
        userId: { type: integer }
        programId: { type: integer }
        status: { type: string, enum: [enrolled, waitlisted, cancelled, completed] }
        programTitle: { type: string }
        programStartDate: { type: ["string", "null"] }
        userName: { type: string }
        userEmail: { type: string }
    EnrollmentUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [enrolled, waitlisted, cancelled, completed] }
