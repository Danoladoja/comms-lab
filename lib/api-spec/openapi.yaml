openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user
  - name: programs
    description: Programs and sessions
  - name: enrollments
    description: Enrollment operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get (and JIT-provision) the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List programs (published only for non-admins)
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [admin]
      summary: Create a program (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a program
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateProgram
      tags: [admin]
      summary: Update a program (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}/sessions:
    get:
      operationId: listProgramSessions
      tags: [programs]
      summary: List sessions of a program (join/recording links only when authorized)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: createSession
      tags: [admin]
      summary: Add a session to a program (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}:
    patch:
      operationId: updateSession
      tags: [admin]
      summary: Update a session (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteSession
      tags: [admin]
      summary: Delete a session (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/join:
    post:
      operationId: joinSession
      tags: [enrollments]
      summary: Record attendance for a live session and return the join link (learners must have unlocked the module)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attendance recorded (or already recorded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/quiz:
    get:
      operationId: getSessionQuiz
      tags: [enrollments]
      summary: Get the quiz for a module (answers hidden for learners; module must be unlocked)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Quiz questions and the learner's best result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No quiz for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: upsertSessionQuiz
      tags: [admin]
      summary: Replace the quiz for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/quiz/attempts:
    post:
      operationId: submitQuizAttempt
      tags: [enrollments]
      summary: Submit quiz answers; graded on the server, 70% passes, unlimited retakes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No quiz for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/assignment:
    get:
      operationId: getSessionAssignment
      tags: [enrollments]
      summary: Get the assignment for a module with the learner's submission if any
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No assignment for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: upsertSessionAssignment
      tags: [admin]
      summary: Create or replace the assignment for a module (admin or assigned instructor)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentDetail"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sessions/{id}/assignment/submission:
    post:
      operationId: submitAssignment
      tags: [enrollments]
      summary: Submit (or update) the written assignment for a module
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionInput"
      responses:
        "200":
          description: Submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmission"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Locked or not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No assignment for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /my/progress:
    get:
      operationId: listMyProgress
      tags: [enrollments]
      summary: Per-module progress, lock state, and replay rights across the user's enrolled programs
      responses:
        "200":
          description: Progress entries, one per session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionProgress"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}/enroll:
    post:
      operationId: enrollInProgram
      tags: [enrollments]
      summary: Enroll the current user (waitlisted when at capacity)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /my/enrollments:
    get:
      operationId: listMyEnrollments
      tags: [enrollments]
      summary: List current user's enrollments with program details
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /my/sessions:
    get:
      operationId: listMySessions
      tags: [enrollments]
      summary: Upcoming and past sessions across the user's enrolled programs (or taught programs for instructors)
      responses:
        "200":
          description: Sessions with program titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's role (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/enrollments:
    get:
      operationId: listAllEnrollments
      tags: [admin]
      summary: List enrollments with user and program info (admin)
      parameters:
        - name: programId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentDetail"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /admin/enrollments/{id}:
    patch:
      operationId: updateEnrollment
      tags: [admin]
      summary: Update an enrollment's status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /programs/{id}/threads:
    get:
      operationId: listProgramThreads
      tags: [forum]
      summary: List forum threads for a program (enrolled learners and staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Threads, pinned first then most recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadList"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: createProgramThread
      tags: [forum]
      summary: Start a new discussion thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadInput"
      responses:
        "200":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThread"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /threads/{id}:
    get:
      operationId: getThread
      tags: [forum]
      summary: A thread with all its replies
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Thread detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /threads/{id}/posts:
    post:
      operationId: createThreadPost
      tags: [forum]
      summary: Reply to a thread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Created reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /threads/{id}/pin:
    post:
      operationId: setThreadPinned
      tags: [forum]
      summary: Pin or unpin a thread (admin or program facilitator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThread"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    ForumThread:
      type: object
      required: [id, programId, title, body, pinned, authorName, authorRole, replyCount, lastActivityAt, createdAt, mine]
      properties:
        id: { type: integer }
        programId: { type: integer }
        title: { type: string }
        body: { type: string }
        pinned: { type: boolean }
        authorName: { type: string }
        authorRole: { type: string }
        replyCount: { type: integer }
        lastActivityAt: { type: string }
        createdAt: { type: string }
        mine: { type: boolean }
    ThreadList:
      type: object
      required: [canModerate, threads]
      properties:
        canModerate: { type: boolean }
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ForumThread"
    ForumPost:
      type: object
      required: [id, threadId, body, authorName, authorRole, createdAt, mine]
      properties:
        id: { type: integer }
        threadId: { type: integer }
        body: { type: string }
        authorName: { type: string }
        authorRole: { type: string }
        createdAt: { type: string }
        mine: { type: boolean }
    ThreadDetail:
      type: object
      required: [thread, posts, canModerate]
      properties:
        thread:
          $ref: "#/components/schemas/ForumThread"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/ForumPost"
        canModerate: { type: boolean }
    ThreadInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 5000 }
    PostInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    PinInput:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    User:
      type: object
      required: [id, clerkUserId, email, name, role]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [learner, instructor, admin] }
    JoinResult:
      type: object
      required: [sessionId, joinedAt]
      properties:
        sessionId: { type: integer }
        joinedAt: { type: string }
        joinUrl: { type: ["string", "null"] }
    SessionProgress:
      type: object
      required: [sessionId, programId, progressPct, attendedLive, completed, locked, hasQuiz, quizPassed, quizBestScore, hasAssignment, assignmentSubmitted]
      properties:
        sessionId: { type: integer }
        programId: { type: integer }
        progressPct: { type: integer }
        attendedLive: { type: boolean }
        completed: { type: boolean }
        locked: { type: boolean }
        hasQuiz: { type: boolean }
        quizPassed: { type: boolean }
        quizBestScore: { type: ["integer", "null"] }
        hasAssignment: { type: boolean }
        assignmentSubmitted: { type: boolean }
    QuizQuestionPublic:
      type: object
      required: [id, prompt, options, sortOrder]
      properties:
        id: { type: integer }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        correctIndex: { type: ["integer", "null"] }
    Quiz:
      type: object
      required: [sessionId, passMark, questions, bestScore, passed]
      properties:
        sessionId: { type: integer }
        passMark: { type: integer }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestionPublic"
        bestScore: { type: ["integer", "null"] }
        passed: { type: boolean }
    QuizInput:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: object
            required: [prompt, options, correctIndex]
            properties:
              prompt: { type: string, minLength: 1 }
              options:
                type: array
                minItems: 2
                items: { type: string, minLength: 1 }
              correctIndex: { type: integer, minimum: 0 }
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
